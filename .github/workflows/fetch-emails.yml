name: Fetch Vpass Emails

on:
  schedule:
    - cron: "0 * * * *" # 1時間毎
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npx tsx ingest/fetch-vpass-emails.ts
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 過去分を.eml添付で自分宛てに転送した場合、その転送元アドレスを設定しておくと
          # 添付メールも自動で取り込み対象になる（未設定なら通常のVpassメールのみ処理）
          SELF_FORWARD_SENDER: ${{ secrets.SELF_FORWARD_SENDER }}

      - run: npx tsx ingest/apply-recurring.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
